<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos e Módulos</title>
  <link rel="stylesheet" href="produtos.css">
</head>
<body>
  
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>📦 Produtos e Módulos</h1>
        <p>Cadastre produtos e módulos com itens em árvore</p>
      </div>
      <div class="acoes">
        <button class="btn btn-produto" onclick="abrirModal('produto')">
          📦 Criar Produto
        </button>
        <button class="btn btn-modulo" onclick="abrirModal('modulo')">
          🏭 Criar Módulo
        </button>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filtros">
      <button class="filtro-btn active" onclick="filtrar('todos')">📋 Todos</button>
      <button class="filtro-btn" onclick="filtrar('produto')">📦 Produtos</button>
      <button class="filtro-btn" onclick="filtrar('modulo')">🏭 Módulos</button>
    </div>

    <!-- GRID DE PRODUTOS -->
    <div class="grid" id="gridProdutos"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitulo">📦 Criar Produto</h3>
        <button class="modal-close" onclick="fecharModal()">×</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="nomeItem" placeholder="Nome do produto/módulo">
        </div>
        
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="descricaoItem" rows="3" placeholder="Descrição..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Tipo</label>
          <select id="tipoItem">
            <option value="produto">📦 Produto</option>
            <option value="modulo">🏭 Módulo</option>
          </select>
        </div>

        <!-- EDITOR DE ITENS EM ÁRVORE -->
        <div class="editor-arvore">
          <div class="editor-header">
            <h4>📝 Itens (Árvore Infinita)</h4>
          </div>
          
          <div class="adicionar-item">
            <input type="text" id="novoItemNome" placeholder="Nome do item">
            <input type="number" id="novoItemQtd" placeholder="Qtd" value="1" min="1">
            <button class="btn-add" onclick="adicionarItem()">➕</button>
          </div>
          
          <div class="arvore-itens" id="arvoreItens">
            <p class="vazio">Nenhum item adicionado</p>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-save" onclick="salvarItem()">💾 Salvar</button>
      </div>
    </div>
  </div>

  <script src="produtos.js"></script>
</body>
</html>
