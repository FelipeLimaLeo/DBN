<!DOCTYPE html>
        <div class="form-group">
          <label>Nome da Obra</label>
          <input type="text" id="obraNome" placeholder="Ex: Presídio Central">
        </div>

        <div class="form-group">
          <label>Quantidade de Celas</label>
          <input type="number" id="obraQtd" value="1">
        </div>
      </div>

      <button class="btn btn-primary" onclick="criarObra()">
        💾 Criar Obra
      </button>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>📦 Obras</h2>
      </div>

      <div class="obras-lista" id="obrasLista"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>📐 Kanban Produção</h2>
      </div>

      <div class="kanban-board kanban-cad-flow">

        <div class="kanban-column">
          <div class="column-header">
            Emitido
            <span class="column-count">0</span>
          </div>
          <div class="column-body"></div>
        </div>

        <div class="kanban-column">
          <div class="column-header">
            Forma
            <span class="column-count">0</span>
          </div>
          <div class="column-body"></div>
        </div>

        <div class="kanban-column">
          <div class="column-header">
            Concretagem
            <span class="column-count">0</span>
          </div>
          <div class="column-body"></div>
        </div>

        <div class="kanban-column">
          <div class="column-header">
            Concluído
            <span class="column-count">0</span>
          </div>
          <div class="column-body"></div>
        </div>

      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
